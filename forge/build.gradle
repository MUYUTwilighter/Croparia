import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'com.github.johnrengelman.shadow'
    id "com.modrinth.minotaur" version "2.+"
    id 'net.darkhax.curseforgegradle' version '1.1.26'
}

loom {
    forge {
        mixinConfig "croparia-if-common.mixins.json", "croparia-if-forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$forge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "me.shedaniel:architectury-forge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.4.1"))

    // REI
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-forge:6.5.436"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-forge:6.5.436"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-forge:6.5.436"
    // No EMI as it does not support forge 1.18.2
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

modrinth {
    token = System.getenv("MODRINTH_MOD_PUBLISH")
    projectId = "croparia-if"
    versionName = archives_name + "-forge-" + mod_version
    versionNumber = mod_version
    versionType = mod_version.contains("pre") ? "beta" : "release"
    uploadFile = remapJar
    gameVersions = [minecraft_version]
    loaders = ["forge"]
    changelog = rootProject.file("changelog.md").text
    dependencies {
        required.project "architectury-api"
        incompatible.project "croparia"
    }
}

tasks.register('curseforge', TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_MOD_PUBLISH")
    def mainFile = upload('971004', remapJar)
    mainFile.displayName = archives_name + "-forge-" + mod_version
    mainFile.releaseType = mod_version.contains("pre") ? "beta" : "release"
    mainFile.changelog = rootProject.file("changelog.md").text
    mainFile.changelogType = 'markdown'
    mainFile.gameVersions = [minecraft_version]
    mainFile.addJavaVersion("Java 17")
    mainFile.addEnvironment("server", "client")
    mainFile.addModLoader("forge")
    mainFile.addRequirement("architectury-api")
    mainFile.addIncompatibility("croparia")
}